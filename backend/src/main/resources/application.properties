# ============================================================
# Spring Application Config
# ============================================================

spring.application.name=icms-backend
server.port=8080

# ============================================================
# Active Database Profile:
# Default set to 'h2' for zero-setup instant startup out of the box.
# Set to 'mysql' to connect to your local MySQL Database server.
# ============================================================

spring.profiles.active=h2

# ============================================================
# H2 FILE-BASED Database Settings (data survives restarts!)
# Stored at: backend/data/icmsdb.mv.db
# ============================================================

spring.datasource.url=jdbc:h2:file:./data/icmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Custom ICMS Security Settings
# ============================================================

icms.app.jwt-secret=IntegratedContactManagementSystemSecretKey2026SuperSecureToken
icms.app.jwt-expiration-ms=86400000