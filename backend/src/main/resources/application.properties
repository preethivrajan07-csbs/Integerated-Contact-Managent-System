# ============================================================
# Spring Application Config
# ============================================================

spring.application.name=icms-backend
server.port=8080

# ============================================================
# Active Database Profile:
# Default set to 'h2' for zero-setup instant startup out of the box.
# Set to 'mysql' to connect to your local MySQL Database server.
# ============================================================

spring.profiles.active=h2

# ============================================================
# H2 In-Memory Database Settings
# ============================================================

spring.datasource.url=jdbc:h2:mem:icmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Custom ICMS Security Settings
# ============================================================

icms.app.jwt-secret=IntegratedContactManagementSystemSecretKey2026SuperSecureToken
icms.app.jwt-expiration-ms=86400000